name: Source verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check publication policy
        run: python scripts/check_public_tree.py
      - name: Scan for secrets with a checksum-verified binary
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --no-banner
      - name: Install test and audit dependencies
        run: pip install -r mvp/backend/requirements-dev.txt -r requirements-model.txt bandit==1.9.4 pip-audit==2.10.1
      - name: Test API and access controls
        working-directory: mvp/backend
        run: python -m pytest -q
      - name: Test public model loader
        run: python -m pytest -q tests
      - name: Audit backend requirements
        run: pip-audit -r mvp/backend/requirements.txt --progress-spinner off
      - name: Audit test requirements
        run: pip-audit -r mvp/backend/requirements-dev.txt --progress-spinner off
      - name: Audit model requirements
        run: pip-audit -r requirements-model.txt --progress-spinner off
      - name: Detect high severity Python findings
        run: bandit -r mvp/backend/app baseline --severity-level high
      - name: Install and audit frontend
        working-directory: mvp/frontend
        run: npm ci && npm audit
      - name: Build and test frontend logic
        working-directory: mvp/frontend
        run: |
          npm run build
          node scripts/test-case-library.mjs
          node scripts/test-job-tracking.mjs
          node scripts/test-labeling-handoff.mjs
          node scripts/test-permissions.mjs
