<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc"><title id="title">Baseline S tensor workflow</title><desc id="desc">Caller preprocessing supplies two prepared tensors to the bundled Baseline S loader. Caller postprocessing restores geometry for human review. Preprocessing and postprocessing integrations are supplied separately.</desc><rect width="1200" height="230" rx="18" fill="#101d30"/><g font-family="Arial, sans-serif" text-anchor="middle"><text x="600" y="35" fill="#eaf5ff" font-size="18">A clear boundary between the model and your application</text><g fill="#1c3348" stroke="#38536a"><rect x="28" y="68" width="246" height="104" rx="12"/><rect x="326" y="68" width="246" height="104" rx="12" stroke="#60d8c1"/><rect x="624" y="68" width="246" height="104" rx="12"/><rect x="922" y="68" width="246" height="104" rx="12"/></g><g fill="#e4f2ff" font-size="19"><text x="151" y="104">Prepare tensors</text><text x="449" y="104">Baseline S</text><text x="747" y="104">Restore geometry</text><text x="1045" y="104">Human review</text></g><g fill="#a9c3d6" font-size="13"><text x="151" y="136">Caller-supplied preprocessing</text><text x="449" y="136">Bundled ONNX + loader</text><text x="747" y="136">Caller-supplied postprocessing</text><text x="1045" y="136">Application integration</text></g><g stroke="#60d8c1" stroke-width="3" fill="none"><path d="M281 120h36m-10-7 10 7-10 7M579 120h36m-10-7 10 7-10 7M877 120h36m-10-7 10 7-10 7"/></g><text x="600" y="207" fill="#a9c3d6" font-size="13">M and L return None. The application ships without an automatic raw-CT inference runner.</text></g></svg>